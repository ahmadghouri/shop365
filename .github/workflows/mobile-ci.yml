name: Mobile CI

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  ci:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (verifies Metro/NativeWind compiles)
        run: npx --no-install expo export --platform web --output-dir dist-web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://pakmovie.online' }}

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: mobile/dist-web
          retention-days: 7
