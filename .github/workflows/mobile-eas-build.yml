name: Mobile EAS Build & Release

on:
  push:
    tags:
      - 'mobile-*'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.platform || 'android' }}) — ${{ github.event.inputs.profile || 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Determine build profile & platform
        id: params
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROFILE="${{ github.event.inputs.profile }}"
          PLATFORM="${{ github.event.inputs.platform }}"
          if [[ -z "$PROFILE" ]]; then
            if [[ "$TAG" == *"prod"* ]] || [[ "$TAG" == *"production"* ]]; then
              PROFILE="production"
            elif [[ "$TAG" == *"dev"* ]]; then
              PROFILE="development"
            else
              PROFILE="preview"
            fi
          fi
          if [[ -z "$PLATFORM" ]]; then
            PLATFORM="android"
          fi
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT

      - name: Run EAS build
        run: |
          PLATFORM="${{ steps.params.outputs.platform }}"
          PROFILE="${{ steps.params.outputs.profile }}"
          if [ "$PLATFORM" = "all" ]; then
            eas build --profile "$PROFILE" --platform all --non-interactive --no-wait
          else
            eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://pakmovie.online' }}
